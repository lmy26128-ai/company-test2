<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>건강검진 관리 시스템</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; min-height: 100vh; }
  header { background: #4338ca; color: white; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { color: #a5b4fc; font-size: 0.8rem; margin-top: 2px; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 28px; }
  .search-row input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #d1d5db; font-size: 1rem; outline: none; transition: border-color .2s; }
  .search-row input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  .search-row button { padding: 12px 24px; border-radius: 10px; background: #4f46e5; color: white; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background .2s; }
  .search-row button:hover { background: #4338ca; }
  .search-row button:disabled { opacity: .5; cursor: default; }
  .card { background: white; border-radius: 14px; border: 2px solid #e5e7eb; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px; }
  .card.on-leave { background: #fff1f2; border-color: #fca5a5; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .card-name { font-size: 1.5rem; font-weight: 800; color: #111827; }
  .card-dept { color: #6b7280; font-size: 0.82rem; margin-top: 3px; }
  .card-sabun { font-size: 1.1rem; font-family: monospace; font-weight: 700; color: #4f46e5; }
  .leave-badge { display: inline-block; margin-top: 4px; padding: 2px 8px; background: #fecdd3; color: #9f1239; border: 1px solid #fda4af; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 14px; }
  .field { display: flex; gap: 8px; align-items: baseline; }
  .field-label { color: #9ca3af; font-size: 0.78rem; width: 48px; flex-shrink: 0; }
  .field-value { color: #1f2937; font-size: 0.85rem; font-weight: 600; }
  .section-label { color: #9ca3af; font-size: 0.72rem; margin-bottom: 6px; }
  .target-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .target-badge { padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; border: 1px solid; }
  .target-badge.yes { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
  .target-badge.no { background: #f9fafb; color: #9ca3af; border-color: #e5e7eb; text-decoration: line-through; }
  .hazard-box { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; color: #9a3412; line-height: 1.5; }
  .year-tabs { display: flex; border-radius: 14px 14px 0 0; overflow: hidden; }
  .year-tab { flex: 1; padding: 10px; text-align: center; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; background: #f9fafb; color: #6b7280; border-bottom: 2px solid #e5e7eb; transition: all .15s; }
  .year-tab.active { background: #4f46e5; color: white; border-bottom-color: #4f46e5; }
  .year-tab:hover:not(.active) { background: #f3f4f6; }
  .checkup-table { background: white; border-radius: 0 0 14px 14px; border: 2px solid #e5e7eb; border-top: none; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .checkup-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 8px; margin-bottom: 8px; background: #f9fafb; }
  .checkup-row.no-target { opacity: 0.38; }
  .checkup-name { font-size: 0.85rem; font-weight: 600; color: #374151; }
  .checkup-note { font-size: 0.72rem; color: #9ca3af; margin-left: 6px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; border: 1px solid; }
  .badge.completed { background: #f0fdf4; color: #166534; border-color: #86efac; }
  .badge.scheduled { background: #eff6ff; color: #1e40af; border-color: #93c5fd; }
  .badge.overdue   { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
  .badge.empty { background: #f9fafb; color: #9ca3af; border-color: #e5e7eb; }
  .legend { display: flex; gap: 12px; padding-top: 12px; border-top: 1px solid #f3f4f6; margin-top: 4px; }
  .legend span { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: #6b7280; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.green { background: #4ade80; }
  .dot.blue { background: #60a5fa; }
  .dot.gray { background: #d1d5db; }
  .empty-state { text-align: center; padding: 64px 0; color: #9ca3af; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 1rem; font-weight: 600; color: #6b7280; }
  .empty-state small { font-size: 0.82rem; margin-top: 4px; display: block; }
  .not-found { text-align: center; padding: 40px 0; color: #9ca3af; }
  .not-found p { font-size: 1rem; font-weight: 600; color: #6b7280; }
  .error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 10px; padding: 12px 16px; font-size: 0.85rem; margin-bottom: 16px; }
  .y23-note { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 12px; font-size: 0.75rem; color: #6b7280; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <h1>건강검진 관리 시스템</h1>
  <p>익산2공장 검진 현황 조회</p>
</header>

<main>
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="사번 또는 성명 입력 (예: 2150570 또는 이우상)" />
    <button id="searchBtn" disabled>로딩 중…</button>
  </div>
  <div id="error" class="error" style="display:none"></div>
  <div id="result"></div>
</main>

<script>
let employees = [];

const YEARS = [
  { key: 'y24', label: '24년' },
  { key: 'y25', label: '25년' },
  { key: 'y26', label: '26년' },
  { key: 'y27', label: '27년' },
];

const CHECKUPS = [
  { key: '보건증일검', label: '보건증 + 일반검진' },
  { key: '배치전',    label: '배치전 특수검진' },
  { key: '배치후',    label: '배치후 특수검진' },
  { key: '정기특검',  label: '정기 특수검진' },
];

function parseEntry(raw) {
  if (!raw) return { value: '', status: 'empty' };
  const idx = raw.lastIndexOf('|');
  if (idx === -1) return { value: raw, status: 'completed' };
  return { value: raw.substring(0, idx), status: raw.substring(idx + 1) || 'empty' };
}

function parseEmployee(raw) {
  return {
    no: raw['no'] || '',
    사번: raw['사번'] || '',
    부서: raw['부서'] || '',
    직군: raw['직군'] || '',
    직무: raw['직무'] || '',
    성명: raw['성명'] || '',
    입사일: raw['입사일'] || '',
    성별: raw['성별'] || '',
    보건증대상: raw['보건증대상'] || '',
    일반대상: raw['일반대상'] || '',
    야간대상: raw['야간대상'] || '',
    특수대상: raw['특수대상'] || '',
    유해인자: raw['유해인자'] || '',
    isOnLeave: !!raw['isOnLeave'],
    y23: { 요약: parseEntry(raw['y23_요약']) },
    y24: { 보건증일검: parseEntry(raw['y24_보건증일검']), 배치전: parseEntry(raw['y24_배치전']), 배치후: parseEntry(raw['y24_배치후']), 정기특검: parseEntry(raw['y24_정기특검']) },
    y25: { 보건증일검: parseEntry(raw['y25_보건증일검']), 배치전: parseEntry(raw['y25_배치전']), 배치후: parseEntry(raw['y25_배치후']), 정기특검: parseEntry(raw['y25_정기특검']) },
    y26: { 보건증일검: parseEntry(raw['y26_보건증일검']), 배치전: parseEntry(raw['y26_배치전']), 배치후: parseEntry(raw['y26_배치후']), 정기특검: parseEntry(raw['y26_정기특검']) },
    y27: { 보건증일검: parseEntry(raw['y27_보건증일검']), 배치전: parseEntry(raw['y27_배치전']), 배치후: parseEntry(raw['y27_배치후']), 정기특검: parseEntry(raw['y27_정기특검']) },
  };
}

function isTarget(emp, key) {
  if (key === '보건증일검') return emp.보건증대상 === 'O' || emp.일반대상 === 'O';
  return emp.특수대상 === 'O';
}

function badge(entry) {
  const labelMap = { empty: '—', completed: '완료', scheduled: '예정', overdue: '초과' };
  const label = entry.value || labelMap[entry.status] || entry.status;
  return `<span class="badge ${entry.status}">${escHtml(label)}</span>`;
}

function targetBadge(label, value) {
  const isY = value === 'O';
  return `<span class="target-badge ${isY ? 'yes' : 'no'}">${label}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let activeYear = 'y26';

function renderResult(emp) {
  const haz = emp.유해인자 && emp.유해인자 !== 'X' && emp.유해인자 !== '';
  const cardCls = emp.isOnLeave ? 'card on-leave' : 'card';

  const yearTabs = YEARS.map(y =>
    `<button class="year-tab ${y.key === activeYear ? 'active' : ''}" onclick="switchYear('${y.key}')">${y.label}</button>`
  ).join('');

  const y23Note = (activeYear === 'y24' && emp.y23.요약.value)
    ? `<div class="y23-note">23년 기록: ${escHtml(emp.y23.요약.value)}</div>`
    : '';

  const yearData = emp[activeYear];
  const checkupRows = CHECKUPS.map(c => {
    const t = isTarget(emp, c.key);
    const entry = yearData[c.key];
    return `<div class="checkup-row ${t ? '' : 'no-target'}">
      <div>
        <span class="checkup-name">${c.label}</span>
        ${!t ? '<span class="checkup-note">(해당없음)</span>' : ''}
      </div>
      ${badge(entry)}
    </div>`;
  }).join('');

  document.getElementById('result').innerHTML = `
    <div class="${cardCls}">
      <div class="card-header">
        <div>
          <div class="card-name">${escHtml(emp.성명)}</div>
          <div class="card-dept">${escHtml(emp.부서)} · ${escHtml(emp.직군)} · ${escHtml(emp.직무)}</div>
        </div>
        <div style="text-align:right">
          <div class="card-sabun">${escHtml(emp.사번)}</div>
          ${emp.isOnLeave ? '<span class="leave-badge">휴직자</span>' : ''}
        </div>
      </div>
      <div class="fields">
        <div class="field"><span class="field-label">입사일</span><span class="field-value">${escHtml(emp.입사일)}</span></div>
        <div class="field"><span class="field-label">성별</span><span class="field-value">${escHtml(emp.성별)}</span></div>
        <div class="field"><span class="field-label">직군</span><span class="field-value">${escHtml(emp.직군)}</span></div>
        <div class="field"><span class="field-label">직무</span><span class="field-value">${escHtml(emp.직무)}</span></div>
      </div>
      <p class="section-label">검진 대상</p>
      <div class="target-row">
        ${targetBadge('보건증', emp.보건증대상)}
        ${targetBadge('일반검진', emp.일반대상)}
        ${targetBadge('야간검진', emp.야간대상)}
        ${targetBadge('특수검진', emp.특수대상)}
      </div>
      ${haz ? `<p class="section-label">유해인자</p><div class="hazard-box">${escHtml(emp.유해인자)}</div>` : ''}
    </div>

    <div>
      <div class="year-tabs" id="yearTabs">${yearTabs}</div>
      <div class="checkup-table" id="checkupBody">
        ${y23Note}
        ${checkupRows}
        <div class="legend">
          <span><span class="dot green"></span>완료</span>
          <span><span class="dot blue"></span>예정</span>
          <span><span class="dot gray"></span>미입력</span>
        </div>
      </div>
    </div>
  `;
  window._currentEmp = emp;
}

function switchYear(yearKey) {
  activeYear = yearKey;
  if (window._currentEmp) renderResult(window._currentEmp);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const found = employees.find(e => e.사번 === q || e.성명 === q);
  const el = document.getElementById('result');
  if (!found) {
    el.innerHTML = `<div class="not-found"><p>검색 결과가 없습니다.</p><small>사번 또는 성명을 정확히 입력해주세요.</small></div>`;
    window._currentEmp = null;
  } else {
    renderResult(found);
  }
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

document.getElementById('result').innerHTML = `
  <div class="empty-state">
    <div class="icon">🔍</div>
    <p>사번 또는 성명으로 검색하세요</p>
    <small>예: 2150570 또는 이우상</small>
  </div>
`;

fetch('employees.json')
  .then(r => r.json())
  .then(data => {
    employees = data.map(parseEmployee);
    const btn = document.getElementById('searchBtn');
    btn.textContent = '검색';
    btn.disabled = false;
  })
  .catch(() => {
    const err = document.getElementById('error');
    err.style.display = 'block';
    err.textContent = '데이터 로딩 실패. serve.ps1을 먼저 실행해주세요.';
  });
</script>
</body>
</html>
