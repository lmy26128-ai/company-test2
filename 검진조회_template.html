<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>건강검진 관리 시스템</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Segoe UI',sans-serif;background:#f1f5f9;min-height:100vh;font-size:15px;color:#1e293b}

/* ── 헤더 ── */
header{background:linear-gradient(135deg,#3730a3 0%,#4f46e5 100%);color:#fff;padding:20px 28px 0;box-shadow:0 4px 20px rgba(67,56,202,.35)}
.hdr-top{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.hdr-title{font-size:1.22rem;font-weight:900;letter-spacing:-.02em}
.hdr-sub{color:#c7d2fe;font-size:.82rem}
.main-tabs{display:flex;gap:2px}
.main-tab{padding:11px 26px;border-radius:10px 10px 0 0;font-size:.92rem;font-weight:700;cursor:pointer;border:none;background:rgba(255,255,255,.12);color:rgba(255,255,255,.65);transition:all .2s}
.main-tab.active{background:#fff;color:#4338ca;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.main-tab:hover:not(.active){background:rgba(255,255,255,.22);color:#fff}

/* ── 레이아웃 ── */
main{max-width:1100px;margin:0 auto;padding:28px 20px}
.view{display:none}.view.active{display:block}

/* ── 검색 ── */
.search-wrap{display:flex;gap:10px;margin-bottom:28px}
.search-wrap input{flex:1;padding:15px 20px;border-radius:14px;border:2px solid #e2e8f0;font-size:1.05rem;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.search-wrap input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.search-wrap button{padding:15px 32px;border-radius:14px;background:#4f46e5;color:#fff;border:none;font-size:.97rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s}
.search-wrap button:active{transform:scale(.97)}
.search-wrap button:hover:not(:disabled){background:#4338ca}
.search-wrap button:disabled{opacity:.5;cursor:not-allowed}

/* ── 직원 카드 ── */
.emp-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:700px){.emp-wrap{grid-template-columns:1fr}}
.emp-card{background:#fff;border-radius:18px;border:2px solid #e2e8f0;box-shadow:0 2px 16px rgba(0,0,0,.06);overflow:hidden}
.emp-card.on-leave{border-color:#fda4af;background:linear-gradient(135deg,#fff5f6,#fff)}
.emp-card-header{padding:22px 24px;border-bottom:1.5px solid #f1f5f9}
.emp-name{font-size:2rem;font-weight:900;color:#0f172a;letter-spacing:-.04em;line-height:1}
.emp-sub{color:#64748b;font-size:.88rem;margin-top:6px;line-height:1.5}
.emp-sabun{font-size:1.15rem;font-family:'Courier New',monospace;font-weight:900;color:#4f46e5;letter-spacing:.02em}
.leave-pill{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 14px;background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5;border-radius:20px;font-size:.78rem;font-weight:800}
.emp-card-body{padding:18px 24px}
.sec-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:10px}
.info-rows{display:grid;grid-template-columns:72px 1fr;gap:6px 0;align-items:baseline}
.il{color:#94a3b8;font-size:.82rem;font-weight:500}
.iv{color:#1e293b;font-size:.92rem;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:800;border:1.5px solid}
.chip.on{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.chip.off{background:#f8fafc;color:#cbd5e1;border-color:#e2e8f0;text-decoration:line-through}
.hazard{margin-top:14px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:12px 16px}
.hazard .sec-label{color:#c2410c;margin-bottom:6px}
.hazard p{font-size:.86rem;color:#9a3412;line-height:1.7}

/* ── 검진 타일 ── */
.checkup-block{background:#fff;border-radius:18px;border:2px solid #e2e8f0;box-shadow:0 2px 16px rgba(0,0,0,.06);overflow:hidden;grid-column:span 2}
@media(max-width:700px){.checkup-block{grid-column:span 1}}
.year-bar{display:flex;background:#f8fafc;border-bottom:2px solid #e2e8f0}
.yb-btn{flex:1;padding:13px 6px;text-align:center;font-size:.9rem;font-weight:800;cursor:pointer;border:none;background:none;color:#94a3b8;position:relative;transition:color .15s}
.yb-btn.active{color:#4338ca;background:#fff}
.yb-btn.active::after{content:'';position:absolute;bottom:-2px;left:16px;right:16px;height:2.5px;background:#4f46e5;border-radius:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}
@media(max-width:500px){.tiles{grid-template-columns:1fr}}
.tile{border-radius:14px;padding:18px 20px;border:2px solid;cursor:default;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile-icon{font-size:1.7rem;margin-bottom:8px}
.tile-name{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.65;margin-bottom:6px}
.tile-date{font-size:1.45rem;font-weight:900;letter-spacing:-.02em;line-height:1}
.tile-stat{font-size:.78rem;font-weight:700;margin-top:5px;opacity:.75}
/* 완료 */
.t-done{background:#f0fdf4;border-color:#86efac;color:#15803d}
/* 예정(미래) */
.t-soon{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
/* 미수검(날짜지남) */
.t-miss{background:#fefce8;border-color:#fde047;color:#854d0e}
/* 미입력 */
.t-none{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}
/* 해당없음 */
.t-na{background:#f8fafc;border-color:#e2e8f0;color:#cbd5e1;opacity:.55}

/* 다음 예정 계산 박스 */
.calc-box{margin:0 20px 20px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1.5px solid #c7d2fe;border-radius:14px;padding:16px 20px}
.calc-box .sec-label{color:#4338ca;margin-bottom:10px}
.calc-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.calc-item{background:#fff;border-radius:10px;padding:12px 14px;border:1.5px solid #e0e7ff}
.calc-type{font-size:.7rem;font-weight:800;color:#6366f1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.calc-date{font-size:1.1rem;font-weight:900;color:#1e293b}
.calc-basis{font-size:.72rem;color:#94a3b8;margin-top:3px}

/* 범례 */
.legend-row{display:flex;gap:14px;padding:14px 20px;border-top:1.5px solid #f1f5f9;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:7px;font-size:.78rem;color:#64748b;font-weight:600}
.leg-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}

/* ── 전체보기 ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.fb-label{font-size:.82rem;font-weight:700;color:#64748b;white-space:nowrap}
.fb-group{display:flex;gap:6px;flex-wrap:wrap}
.fb-btn{padding:8px 18px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .15s}
.fb-btn.active{background:#4f46e5;border-color:#4f46e5;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.fb-btn:hover:not(.active){background:#f1f5f9}
.sep{height:28px;width:1.5px;background:#e2e8f0;align-self:center}

/* 요약 카드 */
.summ-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:600px){.summ-row{grid-template-columns:repeat(2,1fr)}}
.summ-card{background:#fff;border-radius:14px;padding:18px 20px;border:2px solid #e2e8f0;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.summ-n{font-size:2.2rem;font-weight:900;letter-spacing:-.04em;line-height:1}
.summ-l{font-size:.8rem;font-weight:700;color:#64748b;margin-top:5px}
.n-green{color:#16a34a}.n-blue{color:#2563eb}.n-red{color:#dc2626}.n-gray{color:#94a3b8}

/* 테이블 */
.tbl-wrap{background:#fff;border-radius:16px;border:2px solid #e2e8f0;box-shadow:0 2px 16px rgba(0,0,0,.06);overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#f8fafc;padding:13px 16px;text-align:left;font-size:.76rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:12px 16px;font-size:.9rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(0,0,0,.015)}
.tr-done td{background:#f0fdf4}.tr-done:hover td{background:#dcfce7}
.tr-miss td{background:#fefce8}.tr-miss:hover td{background:#fef9c3}
.tr-soon td{background:#eff6ff}.tr-soon:hover td{background:#dbeafe}
.tr-none td{}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:.8rem;font-weight:800;white-space:nowrap}
.p-done{background:#dcfce7;color:#15803d}
.p-miss{background:#fef08a;color:#854d0e;border:1px solid #fde047}
.p-soon{background:#dbeafe;color:#1d4ed8}
.p-none{background:#f1f5f9;color:#94a3b8}
.p-calc{background:#f5f3ff;color:#6d28d9;font-style:italic}
.tbl-name{font-weight:800;color:#0f172a;font-size:.94rem}
.tbl-dept{color:#64748b;font-size:.78rem;margin-top:2px}
.tbl-sabun{font-family:monospace;color:#4f46e5;font-weight:700}
.next-due{font-size:.75rem;color:#7c3aed;margin-top:3px;font-weight:600}

.empty-state{text-align:center;padding:70px 20px;color:#94a3b8}
.empty-state .ei{font-size:3rem;margin-bottom:16px}
.empty-state h3{font-size:1.05rem;font-weight:700;color:#64748b}
.empty-state p{font-size:.85rem;margin-top:6px}

.notice{background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;padding:12px 16px;font-size:.84rem;color:#92400e;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.notice b{flex-shrink:0}

/* ── 퇴사자 ── */
.emp-card.resigned{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-color:#cbd5e1}
.resigned-pill{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 14px;background:#e2e8f0;color:#475569;border:1.5px solid #cbd5e1;border-radius:20px;font-size:.78rem;font-weight:800}
.emp-card.resigned .emp-name{color:#64748b;text-decoration:line-through;text-decoration-color:#94a3b8}
.emp-card.resigned .emp-sabun{color:#94a3b8}
.tr-resigned td{background:#f8fafc;color:#94a3b8}
.tr-resigned:hover td{background:#f1f5f9}
.tr-resigned .tbl-name{color:#94a3b8;text-decoration:line-through}
.tr-resigned .tbl-sabun{color:#cbd5e1}
.show-resigned-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.toggle-resigned{padding:7px 16px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s}
.toggle-resigned.showing{background:#475569;border-color:#475569;color:#fff}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div class="hdr-title">🏥 건강검진 관리 시스템</div>
    <div class="hdr-sub">익산2공장 · 오늘: 2026.05.09</div>
  </div>
  <div class="main-tabs">
    <button class="main-tab active" onclick="switchView('search',this)">개인 조회</button>
    <button class="main-tab" onclick="switchView('full',this)">연도별 전체 보기</button>
  </div>
</header>

<main>

<!-- ════ 개인 조회 ════ -->
<div class="view active" id="view-search">
  <div class="search-wrap">
    <input id="sInput" type="text" placeholder="사번 또는 성명 입력  (예: 2060580 · 이건동)"/>
    <button id="sBtn" disabled>로딩 중…</button>
  </div>
  <div id="sResult">
    <div class="empty-state"><div class="ei">🔍</div><h3>사번 또는 성명으로 검색하세요</h3><p>예: 2060580 &nbsp;·&nbsp; 이건동</p></div>
  </div>
</div>

<!-- ════ 연도별 전체 보기 ════ -->
<div class="view" id="view-full">
  <div class="notice"><b>📌</b> 미수검자 = ① 빨간글씨(명시) ② 파란글씨인데 오늘(2026.05.09) 기준 날짜가 지난 경우. 날짜미입력은 별도 표시.</div>
  <div class="filter-bar">
    <span class="fb-label">연도</span>
    <div class="fb-group">
      <button class="fb-btn" onclick="setF('year','2025',this)">25년</button>
      <button class="fb-btn active" onclick="setF('year','2026',this)">26년</button>
      <button class="fb-btn" onclick="setF('year','2027',this)">27년</button>
    </div>
    <div class="sep"></div>
    <span class="fb-label">검진 종류</span>

    <div class="fb-group">
      <button class="fb-btn active" onclick="setF('type','보건증일검',this)">보건증+일검</button>
      <button class="fb-btn" onclick="setF('type','배치전',this)">배치전</button>
      <button class="fb-btn" onclick="setF('type','배치후',this)">배치후</button>
      <button class="fb-btn" onclick="setF('type','정기특검',this)">정기특검</button>
    </div>
    <div class="show-resigned-wrap">
      <button class="toggle-resigned" id="toggleResigned" onclick="toggleResigned()">퇴사자 숨김</button>
    </div>
  </div>
  <div class="summ-row" id="summRow"></div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th>No</th><th>성명</th><th>사번</th><th>부서</th><th>직군</th><th>이번 수검</th><th>다음 예정(계산)</th>
    </tr></thead>
    <tbody id="tblBody"></tbody>
  </table></div>
</div>

</main>

<script>
// ─── 상수 ───
const TODAY_Y=2026, TODAY_M=5;
const CHECKUP_LABELS={'보건증일검':'보건증+일검','배치전':'배치전 특수검진','배치후':'배치후 특수검진','정기특검':'정기 특수검진'};

// ─── 날짜 유틸 ───
function parseDate(str){
  if(!str||str.trim()==='') return null;
  // 슬래시/세미콜론으로 분리 후 YY.MM 패턴이 있는 파트 탐색
  const parts=str.split(/[\/;]/);
  for(let i=parts.length-1;i>=0;i--){
    const s=parts[i].trim().replace(/\.$/,'');
    const m=s.match(/(\d{2})\.(\d{2})/);
    if(m) return {y:2000+parseInt(m[1]),m:parseInt(m[2])};
  }
  return null;
}
function isPast(str){
  const d=parseDate(str);
  if(!d) return false;
  return d.y<TODAY_Y||(d.y===TODAY_Y&&d.m<=TODAY_M);
}
function addYears(d,n){return {y:d.y+n,m:d.m};}
function addMonths(d,n){let m=d.m+n,y=d.y;while(m>12){m-=12;y++;}return {y,m};}
function fmtDate(d){return d?`${String(d.y).slice(-2)}.${String(d.m).padStart(2,'0')}`:'—';}

// ─── 파싱 ───
function parseEntry(raw){
  if(!raw) return {value:'',status:'empty'};
  const i=raw.lastIndexOf('|');
  return i<0?{value:raw,status:'completed'}:{value:raw.slice(0,i),status:raw.slice(i+1)||'empty'};
}
function parseEmp(r){
  function yd(y,t){return parseEntry(r[`${y}_${t}`]);}
  return {
    no:r.no||'',사번:r['사번']||'',부서:r['부서']||'',직군:r['직군']||'',직무:r['직무']||'',
    성명:r['성명']||'',입사일:r['입사일']||'',성별:r['성별']||'',
    보건증대상:r['보건증대상']||'',일반대상:r['일반대상']||'',야간대상:r['야간대상']||'',특수대상:r['특수대상']||'',
    유해인자:r['유해인자']||'',isOnLeave:!!r['isOnLeave'],isResigned:!!r['isResigned'],
    y23:{요약:parseEntry(r['y23_요약'])},
    y24:{보건증일검:yd('y24','보건증일검'),배치전:yd('y24','배치전'),배치후:yd('y24','배치후'),정기특검:yd('y24','정기특검')},
    y25:{보건증일검:yd('y25','보건증일검'),배치전:yd('y25','배치전'),배치후:yd('y25','배치후'),정기특검:yd('y25','정기특검')},
    y26:{보건증일검:yd('y26','보건증일검'),배치전:yd('y26','배치전'),배치후:yd('y26','배치후'),정기특검:yd('y26','정기특검')},
    y27:{보건증일검:yd('y27','보건증일검'),배치전:yd('y27','배치전'),배치후:yd('y27','배치후'),정기특검:yd('y27','정기특검')},
  };
}

// ─── 미수검 판단 ───
// 퇴사자·휴직자는 미수검 판단 제외
function getMissed(entry,emp){
  if(emp.isOnLeave||emp.isResigned) return false;
  if(entry.status==='overdue') return true;
  if(entry.status==='scheduled'&&isPast(entry.value)) return true;
  return false;
}

// ─── 유효 상태 계산 ───
function effectiveStatus(entry,emp){
  if(getMissed(entry,emp)) return 'missed';
  return entry.status;
}

// ─── 대상자 여부 ───
// 특수항목(col12): 비어있거나 'X'면 비대상, 내용 있으면 특수검진 대상
function isSpecial(e){
  const v=(e.특수대상||'').trim();
  return v!==''&&v!=='X';
}
function isTarget(e,type){
  if(type==='보건증일검') return e.보건증대상==='O'||e.일반대상==='O';
  return isSpecial(e);
}

// ─── 전체보기 엔트리 조회 ───
// 해당 연도 컬럼 우선, 비어있으면 다른 컬럼에서 같은 연도 날짜 탐색
function findEntry(emp,year,type){
  const yk='y'+String(year).slice(-2);
  const direct=(emp[yk]&&emp[yk][type])||{value:'',status:'empty'};
  if(direct.status!=='empty') return direct;
  // 다른 컬럼에서 해당 연도 날짜 찾기 (예: y25_배치후에 26년 날짜가 있는 경우)
  for(const col of ['y25','y26','y27']){
    if(col===yk) continue;
    const e=emp[col]&&emp[col][type];
    if(!e||e.status==='empty') continue;
    const d=parseDate(e.value);
    if(d&&d.y===year) return e;
  }
  return direct;
}

// ─── 최신 완료 날짜 탐색 헬퍼 ───
function latestCompleted(emp,type){
  let best=null;
  for(const col of ['y24','y25','y26','y27']){
    const e=emp[col]&&emp[col][type];
    if(!e||e.status!=='completed') continue;
    const d=parseDate(e.value);
    if(d&&(!best||d.y>best.y||(d.y===best.y&&d.m>best.m))) best=d;
  }
  return best;
}

// ─── 다음 수검일 자동 계산 ───
function calcNext(emp){
  // 퇴사자는 계산 불필요
  if(emp.isResigned) return {};
  const result={};

  // 보건증+일검: 마지막 완료 기준 +1년
  if(isTarget(emp,'보건증일검')){
    const last=latestCompleted(emp,'보건증일검');
    if(last) result['보건증일검']={date:addYears(last,1),basis:`마지막 수검 ${fmtDate(last)} 기준`};
  }

  if(isSpecial(emp)){
    const lastJeon=latestCompleted(emp,'배치전');
    const lastHu  =latestCompleted(emp,'배치후');

    // 배치후: 배치전 완료 후 아직 배치후 미수검인 경우만 계산
    if(lastJeon){
      const huDue=addMonths(lastJeon,6);
      const alreadyDone=lastHu&&(lastHu.y>lastJeon.y||(lastHu.y===lastJeon.y&&lastHu.m>=lastJeon.m));
      if(!alreadyDone) result['배치후']={date:huDue,basis:`배치전 ${fmtDate(lastJeon)} +6개월`};
    }

    // 정기특검: 마지막 완료 정기특검 기준 +1년 / 없으면 배치후 기준 +1년
    if(lastHu){
      const lastJeonggi=latestCompleted(emp,'정기특검');
      if(lastJeonggi){
        result['정기특검']={date:addYears(lastJeonggi,1),basis:`마지막 정기특검 ${fmtDate(lastJeonggi)} +1년`};
      } else {
        result['정기특검']={date:addYears(lastHu,1),basis:`배치후 ${fmtDate(lastHu)} +1년`};
      }
    }
  }

  return result;
}

// ─── 개인 조회 렌더 ───
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let curEmp=null,curYear='y25';

function doSearch(){
  const q=document.getElementById('sInput').value.trim();
  if(!q) return;
  const e=employees.find(x=>x.사번===q||x.성명===q);
  const el=document.getElementById('sResult');
  if(!e){
    el.innerHTML=`<div class="empty-state"><div class="ei">😕</div><h3>검색 결과가 없습니다</h3><p>사번 또는 성명을 정확히 입력해주세요</p></div>`;
    return;
  }
  curEmp=e; curYear='y26';
  renderEmp();
}

function renderEmp(){
  const e=curEmp;
  const haz=e.유해인자&&e.유해인자!=='X'&&e.유해인자.trim()!=='';
  const next=calcNext(e);
  const cardCls=e.isResigned?'resigned':e.isOnLeave?'on-leave':'';
  document.getElementById('sResult').innerHTML=`
  <div class="emp-wrap">
    <div class="emp-card ${cardCls}">
      <div class="emp-card-header">
        <div class="emp-name">${esc(e.성명)}</div>
        <div class="emp-sub">${esc(e.부서)} · ${esc(e.직군)} · ${esc(e.직무)}</div>
        <div class="emp-sabun">${esc(e.사번)}</div>
        ${e.isResigned?'<div class="resigned-pill">🚪 퇴사</div>':e.isOnLeave?'<div class="leave-pill">🏥 현재 휴직자</div>':''}
      </div>
      <div class="emp-card-body">
        <div class="sec-label">인적사항</div>
        <div class="info-rows">
          <span class="il">입사일</span><span class="iv">${esc(e.입사일)}</span>
          <span class="il">성별</span><span class="iv">${esc(e.성별)}</span>
        </div>
        <div class="sec-label" style="margin-top:14px">검진 대상</div>
        <div class="chips">
          ${chip('보건증',e.보건증대상)}${chip('일반검진',e.일반대상)}${chip('야간검진',e.야간대상)}${chip('특수검진',isSpecial(e)?'O':'X')}
        </div>
        ${haz?`<div class="hazard"><div class="sec-label">유해인자</div><p>${esc(e.유해인자)}</p></div>`:''}
      </div>
    </div>

    <div class="emp-card ${e.isResigned?'resigned':e.isOnLeave?'on-leave':''}">
      <div class="emp-card-header"><div class="sec-label" style="margin-bottom:4px">자동 계산 — 다음 수검 예정일</div>
        ${Object.keys(next).length===0?'<p style="color:#94a3b8;font-size:.86rem">계산 가능한 기준 날짜가 없습니다</p>':''}
        <div class="calc-rows" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
          ${Object.entries(next).map(([type,info])=>`
          <div class="calc-item" style="background:#fff;border-radius:10px;padding:12px 14px;border:1.5px solid #e0e7ff">
            <div class="calc-type">${CHECKUP_LABELS[type]||type}</div>
            <div class="calc-date">${fmtDate(info.date)}</div>
            <div class="calc-basis">${esc(info.basis)}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="emp-card-body">
        <div class="sec-label">23년 메모</div>
        <p style="font-size:.85rem;color:#64748b">${esc(e.y23.요약.value)||'—'}</p>
      </div>
    </div>

    <div class="checkup-block">
      <div class="year-bar">
        ${['y25','y26','y27'].map(y=>`<button class="yb-btn ${y===curYear?'active':''}" onclick="switchYear('${y}')">${y.replace('y','')}년</button>`).join('')}
      </div>
      <div id="empTiles">${renderTiles(e,curYear)}</div>
      <div class="legend-row">
        <div class="leg"><div class="leg-dot" style="background:#86efac"></div>수검완료</div>
        <div class="leg"><div class="leg-dot" style="background:#93c5fd"></div>수검예정(미래)</div>
        <div class="leg"><div class="leg-dot" style="background:#fde047"></div>미수검(날짜지남·명시)</div>
        <div class="leg"><div class="leg-dot" style="background:#e2e8f0"></div>날짜미입력</div>
        <div class="leg"><div class="leg-dot" style="background:#e2e8f0;opacity:.4"></div>해당없음</div>
      </div>
    </div>
  </div>`;
}

function chip(lbl,val){return `<span class="chip ${val==='O'?'on':'off'}">${lbl}</span>`;}

function renderTiles(e,year){
  const data=e[year];
  const items=[
    {key:'보건증일검',icon:'📋',lbl:'보건증+일검'},
    {key:'배치전',icon:'🔰',lbl:'배치전 특수'},
    {key:'배치후',icon:'🔄',lbl:'배치후 특수'},
    {key:'정기특검',icon:'📅',lbl:'정기 특수'},
  ];
  return `<div class="tiles">${items.map(({key,icon,lbl})=>{
    if(!isTarget(e,key)) return `<div class="tile t-na"><div class="tile-icon">${icon}</div><div class="tile-name">${lbl}</div><div class="tile-date">—</div><div class="tile-stat">해당없음</div></div>`;
    const entry=data[key];
    const missed=getMissed(entry,e);
    let cls,stat;
    if(missed){cls='t-miss';stat='⚠ 미수검';}
    else if(entry.status==='completed'){cls='t-done';stat='✓ 수검완료';}
    else if(entry.status==='scheduled'){cls='t-soon';stat='⏰ 수검예정';}
    else{cls='t-none';stat='— 날짜미입력';}
    const disp=entry.value||stat;
    return `<div class="tile ${cls}"><div class="tile-icon">${icon}</div><div class="tile-name">${lbl}</div><div class="tile-date">${esc(disp)}</div><div class="tile-stat">${stat}</div></div>`;
  }).join('')}</div>`;
}

function switchYear(y){
  curYear=y;
  document.querySelectorAll('.yb-btn').forEach(b=>b.classList.toggle('active',b.textContent===y.replace('y','')+'년'));
  document.getElementById('empTiles').innerHTML=renderTiles(curEmp,y);
}

// ─── 전체보기 ───
let fYear=2026,fType='보건증일검',showResigned=false;

function toggleResigned(){
  showResigned=!showResigned;
  const btn=document.getElementById('toggleResigned');
  btn.textContent=showResigned?'퇴사자 표시 중':'퇴사자 숨김';
  btn.classList.toggle('showing',showResigned);
  renderFull();
}

function setF(dim,val,btn){
  const grp=btn.closest('.fb-group');
  grp.querySelectorAll('.fb-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(dim==='year') fYear=parseInt(val);
  else fType=val;
  renderFull();
}

function renderFull(){
  // 퇴사자는 토글에 따라 포함 여부 결정, 휴직자는 항상 제외
  const targets=employees.filter(e=>{
    if(e.isOnLeave) return false;
    if(e.isResigned&&!showResigned) return false;
    return isTarget(e,fType);
  });
  const rows=targets.map(e=>{
    const entry=findEntry(e,fYear,fType);
    const status=effectiveStatus(entry,e);
    const next=calcNext(e)[fType];
    return {e,entry,status,next};
  });

  const cnt={completed:0,missed:0,scheduled:0,empty:0};
  rows.forEach(r=>{
    if(r.e.isResigned) return; // 퇴사자는 카운트 제외
    if(r.status in cnt) cnt[r.status]++;else cnt.empty++;
  });

  // 정렬: 미수검 → 날짜미입력 → 예정 → 완료 → 퇴사(맨 뒤)
  const ORD={missed:0,empty:1,scheduled:2,completed:3,resigned:9};
  rows.sort((a,b)=>{
    const sa=a.e.isResigned?'resigned':a.status;
    const sb=b.e.isResigned?'resigned':b.status;
    return (ORD[sa]??4)-(ORD[sb]??4);
  });

  const resignedCnt=rows.filter(r=>r.e.isResigned).length;
  document.getElementById('summRow').innerHTML=`
    <div class="summ-card"><div class="summ-n n-green">${cnt.completed}</div><div class="summ-l">✓ 수검완료</div></div>
    <div class="summ-card"><div class="summ-n n-blue">${cnt.scheduled}</div><div class="summ-l">⏰ 수검예정</div></div>
    <div class="summ-card"><div class="summ-n n-red">${cnt.missed}</div><div class="summ-l">⚠ 미수검</div></div>
    <div class="summ-card"><div class="summ-n n-gray">${cnt.empty}</div><div class="summ-l">— 날짜미입력</div></div>
    ${showResigned&&resignedCnt>0?`<div class="summ-card"><div class="summ-n" style="color:#94a3b8">${resignedCnt}</div><div class="summ-l">🚪 퇴사(표시중)</div></div>`:''}`;

  const pCls={completed:'p-done',missed:'p-miss',scheduled:'p-soon',empty:'p-none'};
  const pLbl={completed:'수검완료',missed:'미수검',scheduled:'수검예정',empty:'날짜미입력'};

  document.getElementById('tblBody').innerHTML=rows.length===0
    ?'<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">대상자가 없습니다</td></tr>'
    :rows.map(({e,entry,status,next})=>{
      const isR=e.isResigned;
      const rowCls=isR?'tr-resigned':{completed:'tr-done',missed:'tr-miss',scheduled:'tr-soon',empty:'tr-none'}[status]||'';
      const pillCls=isR?'p-none':pCls[status]||'p-none';
      const pillLbl=isR?'🚪 퇴사':pLbl[status]||'—';
      const nextCell=isR?`<span style="color:#cbd5e1">—</span>`
        :next?`<span class="pill p-calc">${fmtDate(next.date)}</span><div class="next-due">${esc(next.basis)}</div>`
        :`<span style="color:#cbd5e1">—</span>`;
      return `
    <tr class="${rowCls}">
      <td style="color:#94a3b8;font-size:.8rem">${esc(e.no)}</td>
      <td><div class="tbl-name">${esc(e.성명)}</div><div class="tbl-dept">${esc(e.부서)}</div></td>
      <td class="tbl-sabun">${esc(e.사번)}</td>
      <td style="color:#64748b;font-size:.85rem">${esc(e.부서)}</td>
      <td style="color:#64748b;font-size:.85rem">${esc(e.직군)}</td>
      <td>
        <span class="pill ${pillCls}">${pillLbl}</span>
        ${!isR&&entry.value?`<span style="margin-left:6px;font-size:.78rem;color:#64748b">${esc(entry.value)}</span>`:''}
      </td>
      <td>${nextCell}</td>
    </tr>`;
    }).join('');
}

// ─── 뷰 전환 ───
function switchView(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='full') renderFull();
}

// ─── 이벤트 ───
document.getElementById('sBtn').addEventListener('click',doSearch);
document.getElementById('sInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

// ─── 데이터 ───
let employees=[];
(function(){
  const data=__EMPLOYEE_DATA__;
  employees=data.map(parseEmp);
  document.getElementById('sBtn').textContent='검색';
  document.getElementById('sBtn').disabled=false;
})();
</script>
