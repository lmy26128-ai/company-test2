<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건강검진 조회 시스템</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif;background:#f0f2f5;color:#222;min-height:100vh}
header{background:linear-gradient(135deg,#1a3a5c,#2d6a9f);color:#fff;padding:20px 32px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.3px}
header span{font-size:.85rem;opacity:.75;margin-top:2px}
.search-wrap{max-width:860px;margin:32px auto 0;padding:0 20px}
.search-box{display:flex;gap:10px;background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.search-box input{flex:1;border:1.5px solid #dde3ed;border-radius:8px;padding:10px 14px;font-size:1rem;font-family:inherit;outline:none;transition:border .2s}
.search-box input:focus{border-color:#2d6a9f}
.search-box button{background:#2d6a9f;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:.95rem;font-family:inherit;cursor:pointer;font-weight:600;transition:background .2s}
.search-box button:hover{background:#1a3a5c}
.hint{color:#888;font-size:.8rem;margin-top:8px;padding:0 4px}
.result-area{max-width:860px;margin:20px auto 40px;padding:0 20px}
.no-result{text-align:center;color:#aaa;padding:48px 0;font-size:1rem}

/* 카드 */
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;margin-bottom:20px}
.card-header{background:linear-gradient(90deg,#1a3a5c,#2d6a9f);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-header .emp-name{font-size:1.25rem;font-weight:700}
.card-header .emp-meta{font-size:.8rem;opacity:.8;margin-top:2px}
.card-header .emp-id{font-size:.85rem;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px}
.card-body{padding:20px 24px}

/* 기본정보 그리드 */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.info-item{background:#f8f9fb;border-radius:8px;padding:10px 14px}
.info-item .label{font-size:.72rem;color:#888;margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.info-item .value{font-size:.95rem;font-weight:600;color:#222}

/* 배지 */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
.badge.ok   {background:#e6f4ea;color:#1e7e34}
.badge.no   {background:#f1f3f5;color:#888}
.badge.night{background:#fff3e0;color:#e65100}

/* 유해인자 */
.hazard-wrap{margin-bottom:20px}
.hazard-wrap .section-title{font-size:.8rem;font-weight:700;color:#555;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.hazard-tags{display:flex;flex-wrap:wrap;gap:6px}
.hazard-tag{background:#e8f0fe;color:#1a56b0;border-radius:6px;padding:4px 10px;font-size:.8rem;font-weight:600}
.no-hazard{color:#aaa;font-size:.85rem}

/* 검진 테이블 */
.section-title{font-size:.8rem;font-weight:700;color:#555;margin-bottom:10px;text-transform:uppercase;letter-spacing:.3px}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #e8ecf0}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead tr{background:#f0f4f8}
thead th{padding:10px 12px;text-align:center;font-weight:700;color:#445;font-size:.78rem;border-bottom:2px solid #dde3ed;white-space:nowrap}
thead th:first-child{text-align:left}
tbody tr:hover{background:#fafbfc}
td{padding:9px 12px;border-bottom:1px solid #f0f0f0;text-align:center;vertical-align:middle}
td:first-child{text-align:left;font-weight:600;color:#334;white-space:nowrap}
.year-badge{display:inline-block;background:#2d6a9f;color:#fff;border-radius:5px;padding:2px 8px;font-size:.75rem;font-weight:700}

/* 날짜 셀 */
.cell-done{background:#e6f4ea;color:#1e7e34;border-radius:6px;padding:3px 8px;font-weight:700;font-size:.82rem;display:inline-block;white-space:nowrap}
.cell-sched{background:#fff3cd;color:#c05000;border-radius:6px;padding:3px 8px;font-weight:700;font-size:.82rem;display:inline-block;white-space:nowrap;border:1px solid #ffd066}
.cell-empty{color:#ccc;font-size:.8rem}

/* 반응형 */
@media(max-width:600px){
  .info-grid{grid-template-columns:1fr 1fr}
  .card-header{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<header>
  <div>

</header>

</div>

</div>

const YEARS = [
  {key:'y23', label:'23년', cols:['ilgeom']},
  {key:'y24', label:'24년', cols:['ilgeom','baejijeon','baejihoo','jeonggi']},
  {key:'y25', label:'25년', cols:['ilgeom','baejijeon','baejihoo','jeonggi']},
  {key:'y26', label:'26년', cols:['ilgeom','baejijeon','baejihoo','jeonggi']},
  {key:'y27', label:'27년', cols:['ilgeom','baejijeon','baejihoo','jeonggi']},
];
const COL_LABELS = {ilgeom:'보건증+일검', baejijeon:'배치전', baejihoo:'배치후', jeonggi:'정기특검'};

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  const area = document.getElementById('resultArea');
  if (!q) { area.innerHTML = '<div class="no-result">사번 또는 이름을 입력하세요</div>'; return; }

  const results = EMPLOYEES.filter(e =>
    e.id.includes(q) || e.name.includes(q)
  );

  if (!results.length) {
    area.innerHTML = '<div class="no-result">검색 결과가 없습니다</div>';
    return;
  }
  area.innerHTML = results.map(renderCard).join('');
}

function renderCard(e) {
  const healthLabel = e.health === 'O' ? '<span class="badge ok">필수</span>' : '<span class="badge no">해당없음</span>';
  const generalLabel = e.general === 'O' ? '<span class="badge ok">대상</span>' : '<span class="badge no">비대상</span>';
  const nightLabel   = e.night === 'O'   ? '<span class="badge night">야간</span>' : '<span class="badge no">해당없음</span>';

  const hazardHtml = e.hazard
    ? e.hazard.split(',').map(h => `<span class="hazard-tag">${h.trim()}</span>`).join('')
    : '<span class="no-hazard">해당없음</span>';

  // 연도별 테이블
  let tableRows = '';
  YEARS.forEach(yr => {
    const yrData = e[yr.key] || {};
    // 해당 연도에 값이 하나라도 있는지 확인
    const hasAny = yr.cols.some(c => yrData[c] && yrData[c].val);
    if (!hasAny && yr.key !== 'y27') return; // 27년은 빈칸도 표시

    const cells = yr.cols.map(col => {
      const cell = yrData[col] || {val:'',status:''};
      if (!cell.val) return `<td><span class="cell-empty">-</span></td>`;
      const cls = cell.status === 'done' ? 'cell-done' : 'cell-sched';
      const icon = cell.status === 'done' ? '✓' : '▶';
      return `<td><span class="${cls}">${icon} ${cell.val}</span></td>`;
    });

    const colCount = yr.cols.length;
    const yearCell = `<td rowspan="1"><span class="year-badge">${yr.label}</span></td>`;
    tableRows += `<tr>${yearCell}${cells.join('')}</tr>`;
  });

  // 27년 빈행 보장
  if (!tableRows.includes('year-badge">27년')) {
    const emptyCells = '<td><span class="cell-empty">-</span></td>'.repeat(4);
    tableRows += `<tr><td><span class="year-badge">27년</span></td>${emptyCells}</tr>`;
  }

  return `
<div class="card">
  <div class="card-header">
    <div>
      <div class="emp-name">${e.name} <small style="font-size:.85rem;opacity:.75">${e.gender}</small></div>
      <div class="emp-meta">${e.dept} · ${e.job} · ${e.role}</div>
    </div>
    <span class="emp-id">사번 ${e.id}</span>
  </div>
  <div class="card-body">
    <div class="info-grid">
      <div class="info-item"><div class="label">입사일</div><div class="value">${e.hire}</div></div>
      <div class="info-item"><div class="label">보건증</div><div class="value">${healthLabel}</div></div>
      <div class="info-item"><div class="label">일반검진</div><div class="value">${generalLabel}</div></div>
      <div class="info-item"><div class="label">야간근무</div><div class="value">${nightLabel}</div></div>
    </div>

    <div class="hazard-wrap">
      <div class="section-title">유해인자</div>
      <div class="hazard-tags">${hazardHtml}</div>
    </div>

    <div class="section-title">연도별 검진 현황</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>연도</th>
            <th>보건증+일검</th>
            <th>배치전</th>
            <th>배치후</th>
            <th>정기특검</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    <div style="margin-top:10px;font-size:.76rem;color:#aaa">
      <span style="background:#e6f4ea;color:#1e7e34;padding:2px 7px;border-radius:4px;font-weight:700">✓ 완료</span>&nbsp;
      <span style="background:#fff3cd;color:#c05000;padding:2px 7px;border-radius:4px;font-weight:700;border:1px solid #ffd066">▶ 예정</span>
    </div>
  </div>
</div>`;
}
</script>
